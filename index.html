<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101513" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171e1a'/%3E%3Cpath d='M8 16h6l4-6 6 12' fill='none' stroke='%23a6e3b4' stroke-width='2'/%3E%3C/svg%3E" />
  <title>Quiet Entry — 전술 계획실</title>
  <style>
    :root{color-scheme:dark;--bg:#101513;--panel:#171e1a;--line:#2b3831;--muted:#839188;--text:#e9f0e9;--green:#a6e3b4;--red:#f16a64;--blue:#6caeff;--yellow:#f0ca63}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation}
    body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    .topbar{height:62px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:#121916;gap:12px}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:30px;height:30px;border:1px solid #52675a;border-radius:9px;display:grid;place-items:center;color:var(--green);font-size:17px}.title-wrap{min-width:0}.eyebrow{font-size:9px;letter-spacing:.18em;color:#809187;font-weight:800}.title{font-size:14px;font-weight:750;letter-spacing:.02em;margin-top:2px;white-space:nowrap}.top-right{display:flex;align-items:center;gap:14px}.status{font-size:11px;color:#a7b5ab;display:flex;align-items:center;gap:8px;white-space:nowrap}.status i{width:7px;height:7px;border-radius:50%;background:#dfbd61;box-shadow:0 0 10px #dfbd6170}.status.live i{background:#89dba1;box-shadow:0 0 10px #89dba170}.btn{border:1px solid #3a4b41;background:#202a24;color:#e8f1e9;border-radius:8px;padding:9px 14px;font:700 11px inherit;cursor:pointer;min-height:36px;transition:.15s}.btn:hover{border-color:#6a8c75;background:#29382d}.btn.primary{background:#a6e3b4;border-color:#a6e3b4;color:#142118}.btn.primary:hover{background:#c0f1ca}.btn:active{transform:translateY(1px)}
    main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px 0;gap:10px}.map-head{height:28px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}.map-label{font-size:10px;letter-spacing:.13em;color:#9aa99e;font-weight:800}.help{font-size:10px;color:#76857b;white-space:nowrap}.canvas-wrap{position:relative;flex:1;min-height:220px;border:1px solid #334239;border-radius:12px;overflow:hidden;background:#151c18;box-shadow:0 12px 34px #0003}.canvas-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 0 50px #070b0880}.canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none}
    .bottom{flex:none;padding:10px 16px max(10px,env(safe-area-inset-bottom));background:#131a16;border-top:1px solid var(--line)}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1300px;margin:auto}.squads{display:flex;gap:8px;flex:1;min-width:0}.squad{--team:#fff;position:relative;display:flex;align-items:center;gap:9px;text-align:left;min-width:112px;flex:1;max-width:205px;border:1px solid #303d35;background:#19211c;color:var(--text);border-radius:9px;padding:8px 10px;cursor:pointer;transition:.15s}.squad:hover{background:#222e26}.squad.active{border-color:var(--team);background:#202a24;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--team) 32%,transparent)}.swatch{width:11px;height:11px;border-radius:50%;background:var(--team);box-shadow:0 0 10px color-mix(in srgb,var(--team) 45%,transparent);flex:none}.squad-info{min-width:0}.squad-name{font-weight:750;font-size:11px;white-space:nowrap}.squad-meta{font-size:9px;color:#849188;margin-top:3px;white-space:nowrap}.sel-tag{font-size:8px;color:#b1c2b5;margin-left:auto;align-self:flex-start;letter-spacing:.1em}.details{display:flex;align-items:center;gap:12px;border-left:1px solid #344138;padding-left:14px;min-width:175px}.unit-dot{width:9px;height:9px;background:var(--green);border-radius:50%;flex:none}.detail-title{font-size:10px;font-weight:750}.detail-sub{font-size:9px;color:#88978d;margin-top:3px;white-space:nowrap}.commands{display:flex;align-items:center;gap:7px}.commands .btn{white-space:nowrap}.small-btn{padding:8px 10px;min-width:38px}.footer-note{text-align:center;color:#68776e;font-size:9px;margin:8px auto 0}
    @media(max-width:720px){.topbar{height:54px;padding:0 12px}.title{font-size:12px}.eyebrow{font-size:8px}.status{font-size:9px}.top-right{gap:7px}.btn{padding:8px 10px;min-height:34px}.map-head{height:22px}.help{font-size:9px}.canvas-wrap{min-height:180px}main{padding:8px 8px 0;gap:6px}.bottom{padding:8px 8px max(8px,env(safe-area-inset-bottom))}.controls{gap:7px;flex-wrap:wrap}.squads{gap:5px;flex-basis:100%}.squad{min-width:0;padding:7px 7px;gap:6px}.squad-name{font-size:10px}.squad-meta{font-size:8px}.details{display:none}.commands{width:100%;justify-content:space-between}.commands .btn{flex:1}.footer-note{margin-top:5px;font-size:8px}}
    @media(max-height:560px) and (min-width:721px){.topbar{height:48px}.bottom{padding:6px 12px}.squad{padding:5px 8px}.footer-note{display:none}main{padding-top:6px}.map-head{height:20px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="mark">⌁</div><div class="title-wrap"><div class="eyebrow">FIELD OPS / 01</div><div class="title">고요한 진입 · 훈련 구역</div></div></div>
    <div class="top-right"><div class="status" id="status"><i></i><span>계획 단계</span></div><button class="btn primary" id="runBtn">▶ 실행</button></div>
  </header>
  <main>
    <div class="map-head"><div class="map-label">작전 구역 <span style="color:#59675e">/</span> 동관 · 01</div><div class="help">분대 카드로 선택 · 유닛 탭으로 개별 지휘 · 지도 탭으로 경로 지정</div></div>
    <div class="canvas-wrap"><canvas id="game" aria-label="전술 작전 지도"></canvas></div>
  </main>
  <footer class="bottom">
    <div class="controls">
      <div class="squads" id="squads"></div>
      <div class="details"><span class="unit-dot" id="unitDot"></span><div><div class="detail-title" id="detailTitle">전술 분대 선택</div><div class="detail-sub" id="detailSub">9명 · 경로 대기</div></div></div>
      <div class="commands"><button class="btn small-btn" id="undoBtn" aria-label="마지막 경로 취소">↶ 취소</button><button class="btn small-btn" id="clearBtn">경로 지우기</button><button class="btn" id="pauseBtn">Ⅱ 일시정지</button></div>
    </div>
    <div class="footer-note">SPACE 실행/일시정지 · 1/2/3 분대 선택 · 경로점은 실행 중에도 추가 가능</div>
  </footer>
  <script src="game.js"></script>
</body>
</html>
